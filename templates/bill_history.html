<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill History - SplitEase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
        }

        .history-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            min-height: 500px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .history-header h2 {
            color: #333;
            font-size: 1.8rem;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .bills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .bill-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .bill-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .bill-title {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .bill-info {
            color: #666;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .bill-amount {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .bill-date {
            color: #999;
            font-size: 0.8rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #333;
        }

        .empty-state p {
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
            color: #e74c3c;
            background: #ffeaea;
            border-radius: 10px;
            margin: 20px 0;
        }

        .error-state h3 {
            margin-bottom: 10px;
        }

        .retry-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .view-btn, .delete-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background-color 0.2s;
        }

        .view-btn {
            background: #e3f2fd;
            color: #1976d2;
        }

        .view-btn:hover {
            background: #bbdefb;
        }

        .delete-btn {
            background: #ffebee;
            color: #d32f2f;
        }

        .delete-btn:hover {
            background: #ffcdd2;
        }

        @media (max-width: 768px) {
            .bills-grid {
                grid-template-columns: 1fr;
            }
            
            .history-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Your Bill History</h1>
            <p>All your split bills in one place</p>
        </div>

        <div class="history-container">
            <div class="history-header">
                <h2>Split Bills</h2>
                <a href="/" class="upload-btn">Upload New Bill</a>
            </div>

            <div id="history-content">
                <!-- Content will be loaded by JavaScript -->
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading your bill history...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load bill history when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadBillHistory();
        });

        function loadBillHistory() {
            const historyContent = document.getElementById('history-content');
            
            fetch('/api/bill-history')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        showErrorState(data.error);
                    } else if (data.bills && data.bills.length > 0) {
                        displayBills(data.bills);
                    } else {
                        showEmptyState();
                    }
                })
                .catch(error => {
                    console.error('Error loading bill history:', error);
                    showErrorState('Failed to load bill history. Please try again.');
                });
        }

        function displayBills(bills) {
            const historyContent = document.getElementById('history-content');
            
            const billsGrid = document.createElement('div');
            billsGrid.className = 'bills-grid';
            
            bills.forEach(bill => {
                const billCard = document.createElement('div');
                billCard.className = 'bill-card';
                
                billCard.innerHTML = `
                    <div class="bill-title">${escapeHtml(bill.filename || 'Unnamed Bill')}</div>
                    <div class="bill-info">Participants: ${bill.participants || 0}</div>
                    <div class="bill-info">Items: ${bill.items || 0}</div>
                    <div class="bill-amount">$${parseFloat(bill.total_amount || 0).toFixed(2)}</div>
                    <div class="bill-date">Created: ${new Date(bill.created_at).toLocaleDateString()}</div>
                    <div class="action-buttons">
                        <button class="view-btn" onclick="viewBillDetails('${bill.id}')">View Details</button>
                        <button class="delete-btn" onclick="deleteBill('${bill.id}')">Delete</button>
                    </div>
                `;
                
                billsGrid.appendChild(billCard);
            });
            
            historyContent.innerHTML = '';
            historyContent.appendChild(billsGrid);
        }

        function showEmptyState() {
            const historyContent = document.getElementById('history-content');
            historyContent.innerHTML = `
                <div class="empty-state">
                    <h3>No Bill History Yet</h3>
                    <p>Start by uploading and splitting your first bill!</p>
                    <a href="/" class="upload-btn">Upload Your First Bill</a>
                </div>
            `;
        }

        function showErrorState(message) {
            const historyContent = document.getElementById('history-content');
            historyContent.innerHTML = `
                <div class="error-state">
                    <h3>Error loading history</h3>
                    <p>${message}</p>
                    <button class="retry-btn" onclick="loadBillHistory()">Try Again</button>
                </div>
            `;
        }

        function viewBillDetails(billId) {
            window.location.href = `/bill-details/${billId}`;
        }

        function deleteBill(billId) {
            if (confirm('Are you sure you want to delete this bill?')) {
                fetch(`/api/delete-bill/${billId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadBillHistory(); // Reload the history
                    } else {
                        alert('Failed to delete bill: ' + (data.error || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error deleting bill:', error);
                    alert('Failed to delete bill. Please try again.');
                });
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
