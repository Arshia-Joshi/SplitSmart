<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Details - SplitEase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: white;
            color: #667eea;
        }

        .bill-details {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .bill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .bill-title {
            font-size: 1.8rem;
            color: #333;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .bill-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .info-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .info-value {
            color: #333;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .split-details {
            margin-top: 30px;
        }

        .split-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
        }

        .participant-list {
            list-style: none;
        }

        .participant-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s;
        }

        .participant-item:hover {
            background: #f8f9fa;
        }

        .participant-name {
            font-size: 1.1rem;
            color: #333;
        }

        .participant-amount {
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .bill-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .bill-info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="/bill-history" class="back-btn">← Back to History</a>

    <div class="container">
        <div class="header">
            <h1>Bill Details</h1>
        </div>

        <div id="bill-content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading bill details...</p>
            </div>
        </div>
    </div>

    <script>
        // Get bill ID from URL
        const pathParts = window.location.pathname.split('/');
        const billId = pathParts[pathParts.length - 1];

        // Load bill details
        document.addEventListener('DOMContentLoaded', function() {
            loadBillDetails();
        });

        function loadBillDetails() {
            fetch(`/api/bill-details/${billId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Bill not found');
                    }
                    return response.json();
                })
                .then(bill => {
                    displayBillDetails(bill);
                })
                .catch(error => {
                    console.error('Error loading bill details:', error);
                    document.getElementById('bill-content').innerHTML = `
                        <div class="error-state">
                            <h3>Error loading bill details</h3>
                            <p>${error.message}</p>
                            <button onclick="loadBillDetails()" class="retry-btn">Try Again</button>
                        </div>
                    `;
                });
        }

        function displayBillDetails(bill) {
            const billContent = document.getElementById('bill-content');
            
            // Create participant list HTML
            let participantListHTML = '';
            for (const [name, amount] of Object.entries(bill.split_details)) {
                participantListHTML += `
                    <li class="participant-item">
                        <span class="participant-name">${name}</span>
                        <span class="participant-amount">₹${parseFloat(amount).toFixed(2)}</span>
                    </li>
                `;
            }

            billContent.innerHTML = `
                <div class="bill-details">
                    <div class="bill-header">
                        <h2 class="bill-title">${bill.restaurant_name}</h2>
                        <div class="total-amount">₹${parseFloat(bill.total_amount).toFixed(2)}</div>
                    </div>

                    <div class="bill-info-grid">
                        <div class="info-card">
                            <div class="info-label">Participants</div>
                            <div class="info-value">${bill.split_among}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">Date</div>
                            <div class="info-value">${new Date(bill.bill_date).toLocaleDateString()}</div>
                        </div>
                    </div>

                    <div class="split-details">
                        <h3 class="split-title">Split Breakdown</h3>
                        <ul class="participant-list">
                            ${participantListHTML}
                        </ul>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
