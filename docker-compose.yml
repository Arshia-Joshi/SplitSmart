# Local Postgres for development: docker compose up -d
# Reads POSTGRES_PASSWORD from .env
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitsmart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: splitsmart
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
